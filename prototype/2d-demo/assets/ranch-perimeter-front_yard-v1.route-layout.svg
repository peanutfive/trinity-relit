      <polyline points="71,105 71,155" fill="none" stroke="#837461" stroke-width="1" />
      <polyline points="82,106 82,156" fill="none" stroke="#837461" stroke-width="1" />
      <polyline points="93,107 93,157" fill="none" stroke="#837461" stroke-width="1" />
      <polyline points="104,108 104,158" fill="none" stroke="#837461" stroke-width="1" />
    </g>
  </g>
  <g id="anchors">
    <circle cx="211" cy="16" r="4.6" fill="#275d4b" stroke="#eee1ba" stroke-width="1.5" data-dir="n" data-target="ne_ranch" data-arrival-x="206" data-arrival-y="55" data-face="down">
      <title>ne_ranch</title>
    </circle>
    <circle cx="217" cy="275" r="4.6" fill="#275d4b" stroke="#eee1ba" stroke-width="1.5" data-dir="s" data-target="se_ranch" data-arrival-x="225" data-arrival-y="235" data-face="up">
      <title>se_ranch</title>
    </circle>
