      <polygon points="495,44 429,50 382,67 353,92 337,126 336,161 348,189 376,210 412,224 496,236" fill="#84988e" stroke="#6b756c" stroke-width="2" />
      <polyline points="495,44 429,50 382,67 353,92 337,126 336,161 348,189 376,210 412,224" fill="none" stroke="#aaa99b" stroke-width="5" stroke-linejoin="round" />
    </g>
    <g data-kind="deck" data-dirs="w u in">
