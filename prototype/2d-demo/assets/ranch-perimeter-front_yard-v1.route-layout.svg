  <g id="feet">
    <circle cx="206" cy="55" r="3.2" fill="none" stroke="#32624f" stroke-width="1.4" />
    <circle cx="225" cy="235" r="3.2" fill="none" stroke="#32624f" stroke-width="1.4" />
    <circle id="spawn" cx="221" cy="148" r="2.6" fill="#514b40" />
  </g>
</svg>
